services:
  # Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: AroNexa-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - AroNexa-network
    restart: unless-stopped

  # Backend Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: AroNexa-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - DATABASE_NAME=${DATABASE_NAME:-AroNexa}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-AroNexa-super-secret-2024}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=1440
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HOST=0.0.0.0
      - PORT=8000
    networks:
      - AroNexa-network
    restart: unless-stopped

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: AroNexa-nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - AroNexa-network
    restart: unless-stopped

networks:
  AroNexa-network:
    driver: bridge